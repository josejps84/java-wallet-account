spring.application.name=account
server.port=${SERVER_PORT:8082}

# Secrets come from environment variables. For local runs, put them in a .env file
# at the repo root (see .env.example); it is git-ignored.
spring.config.import=optional:file:.env[.properties]

# JWT shared with the users service and the gateway (at least 32 bytes)
jwt.secret=${JWT_SECRET}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Audit events
app.audit.exchange=audit_exchange
app.audit.routing-key=audit_routing_key
app.audit.queue=audit_queue

spring.mvc.problemdetails.enabled=true
