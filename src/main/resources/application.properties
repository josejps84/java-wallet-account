spring.application.name=account
server.port=8082
logging.level.org.flywaydb=DEBUG

#autenatication secret
jwt.secret=super-secret-key-change-this-in-production-123456

# Configuración de la Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/accounts
spring.datasource.username=admin
spring.datasource.password=SamplePassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Evita que Hibernate intente crear la tabla automáticamente y cause conflictos con tu script
spring.jpa.hibernate.ddl-auto=none

# Configuración de RabbitMQ
spring.rabbitmq.exchange=audit_exchange
spring.rabbitmq.routing-key=audit_routing_key
spring.rabbitmq.queue=audit_queue

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=SamplePassword123